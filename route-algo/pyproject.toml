[project]
name = "vineyard-route-algo"
version = "0.1.0"
description = "Geometry-constrained vineyard walking routes"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "networkx>=3.4,<4",
  "numpy>=2,<2.4",  # sam3 (optional `model` extra) requires numpy<2.4; one lock for both
  "ortools>=9.12,<10",
  "shapely>=2.1,<3",
  "tifffile>=2024.8",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
# Live fine-tuned SAM 3 (run3c) inference; needs an NVIDIA GPU (CUDA 12.8 wheels).
#   uv sync --project route-algo --extra model
model = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "sam3==0.1.4",
  "psutil>=5",
  "rasterio>=1.4",
  "scipy>=1.13",
  "scikit-image>=0.24",
  "opencv-python-headless>=4.10",
  "typing_extensions<4.16",
  "tqdm<4.68",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["route_algo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
