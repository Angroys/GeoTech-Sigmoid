[project]
name = "vineyard-route-algo"
version = "0.1.0"
description = "Geometry-constrained vineyard walking routes"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "networkx>=3.4,<4",
  "ortools>=9.12,<10",
  "shapely>=2.1,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["route_algo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
